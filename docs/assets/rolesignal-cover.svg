<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">RoleSignal</title>
  <desc id="desc">A career preparation workspace that connects job requirements to candidate evidence.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8f3"/>
      <stop offset="1" stop-color="#eef2e9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcf8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173d2c" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1440" height="430" rx="24" fill="url(#paper)"/>
  <circle cx="1320" cy="44" r="200" fill="#e3ecdd"/>
  <circle cx="1320" cy="44" r="138" fill="#edf2e8"/>
  <circle cx="45" cy="386" r="165" fill="#e9eee3"/>
  <g fill="#1d543b">
    <rect x="72" y="67" width="7" height="19" rx="3.5"/>
    <rect x="84" y="58" width="7" height="28" rx="3.5"/>
    <rect x="96" y="48" width="7" height="38" rx="3.5"/>
  </g>
  <text x="119" y="81" fill="#1d543b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">ROLESIGNAL</text>
  <text x="72" y="156" fill="#778078" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.1">CAREER PREPARATION, GROUNDED IN YOUR WORK</text>
  <text x="72" y="228" fill="#1e2a24" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-2.2">Make your next move</text>
  <text x="72" y="293" fill="#267553" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-2.2">with evidence.</text>
  <text x="74" y="336" fill="#68746b" font-family="Inter, Arial, sans-serif" font-size="17">Turn a role description and real experience into a clear preparation plan.</text>
  <g transform="translate(74 365)">
    <rect width="155" height="32" rx="16" fill="#1d543b"/>
    <circle cx="18" cy="16" r="4" fill="#d6edb0"/>
    <text x="32" y="21" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">BUILT ON CLOUDFLARE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="755" y="43" width="615" height="344" rx="20" fill="url(#card)" stroke="#e2e8df"/>
  </g>
  <text x="790" y="82" fill="#7b897f" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">ROLE REVIEW</text>
  <text x="790" y="112" fill="#1e2a24" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Connect the requirement to proof</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="790" y="139" width="232" height="91" rx="12" fill="#f6f7f2" stroke="#e5e9df"/>
    <text x="808" y="163" fill="#8b968d" font-size="9" font-weight="700" letter-spacing="1.2">ROLE SIGNAL</text>
    <text x="808" y="190" fill="#26362c" font-size="14" font-weight="700">Build reliable systems</text>
    <text x="808" y="210" fill="#778078" font-size="11">Must-have requirement</text>
    <rect x="1103" y="139" width="232" height="91" rx="12" fill="#f2f7f1" stroke="#dae7dc"/>
    <text x="1121" y="163" fill="#63816d" font-size="9" font-weight="700" letter-spacing="1.2">YOUR EVIDENCE</text>
    <text x="1121" y="190" fill="#26362c" font-size="14" font-weight="700">Verified proof point</text>
    <text x="1121" y="210" fill="#778078" font-size="11">Specific action and outcome</text>
    <path d="M1022 184h81" stroke="#88a88e" stroke-width="2"/>
    <circle cx="1062" cy="184" r="11" fill="#e7f0e5" stroke="#b9d0ba"/>
    <path d="m1058 184 3 3 6-7" fill="none" stroke="#267553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="790" y="249" width="545" height="108" rx="12" fill="#ffffff" stroke="#e5e9df"/>
    <text x="808" y="274" fill="#8b968d" font-size="9" font-weight="700" letter-spacing="1.2">EVIDENCE MAP</text>
    <text x="808" y="300" fill="#26362c" font-size="12" font-weight="600">Requirements are linked to candidate-provided skills and outcomes.</text>
    <rect x="808" y="317" width="198" height="7" rx="3.5" fill="#e7eee5"/>
    <rect x="808" y="317" width="133" height="7" rx="3.5" fill="#7fa78a"/>
    <rect x="1020" y="317" width="134" height="7" rx="3.5" fill="#e7eee5"/>
    <rect x="1020" y="317" width="82" height="7" rx="3.5" fill="#d6b379"/>
    <rect x="1168" y="317" width="149" height="7" rx="3.5" fill="#e7eee5"/>
    <rect x="1168" y="317" width="54" height="7" rx="3.5" fill="#c88773"/>
    <text x="808" y="344" fill="#778078" font-size="9">Supported</text>
    <text x="1020" y="344" fill="#778078" font-size="9">Partial</text>
    <text x="1168" y="344" fill="#778078" font-size="9">Gap to review</text>
  </g>
</svg>
